{% extends "base.html" %}
{% set title = "Reset Password" %}
{% block content %}
<main class="page-simple">
  <section class="reset-card">
    <h1>Set a new password</h1>
    <p>Enter a new password with at least 8 characters.</p>

    <form method="post" class="auth-form" novalidate>
      <label for="new-password">New password</label>
      <input id="new-password" name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="New password" />
      <button type="submit">Update password</button>
    </form>

    <a class="back-link" href="{{ url_for('login') }}">Back to sign in</a>
  </section>
</main>
{% endblock %}
