{% extends "base.html" %}
{% set title = "Forgot Password" %}
{% block content %}
<main class="page-simple">
  <section class="reset-card">
    <h1>Reset your password</h1>
    <p>Enter your account email and we will send you a reset link.</p>

    <form method="post" class="auth-form" novalidate>
      <label for="reset-email">Email</label>
      <input id="reset-email" name="email" type="email" autocomplete="email" required placeholder="name@company.com" />
      <button type="submit">Send reset link</button>
    </form>

    <p class="hint">Use the reset link printed in terminal to set a new password.</p>

    <a class="back-link" href="{{ url_for('login') }}">Back to sign in</a>
  </section>
</main>
{% endblock %}
