{% extends "base.html" %}
{% set title = "Create Account" %}
{% block content %}
<main class="page-simple">
  <section class="reset-card">
    <h1>Create your account</h1>
    <p>Use a valid email and a password of at least 8 characters.</p>

    <form method="post" class="auth-form" novalidate>
      <label for="signup-email">Email</label>
      <input id="signup-email" name="email" type="email" autocomplete="email" required placeholder="name@company.com" />

      <label for="signup-password">Password</label>
      <input id="signup-password" name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="Create a password" />

      <button type="submit">Create account</button>
    </form>

    <a class="back-link" href="{{ url_for('login') }}">Back to sign in</a>
  </section>
</main>
{% endblock %}
